<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160d2b"><title>BudgetFlow 6.1</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#153441;background:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:#f3f7f8}button,input,select{font:inherit}button{cursor:pointer}header{background:#102f3c;color:white;padding:25px 20px 40px}header h1{margin:0;font-size:29px;letter-spacing:-1px}header p{color:#b9d5d8;margin:5px 0}.accent{color:#78e2bc}main{max-width:1000px;margin:-20px auto 0;padding:0 16px 120px}.hero{background:white;border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 8px 30px #102f3c19;color:#153441}.hero strong{font-size:34px;display:block;margin:8px 0}.hero small{color:#67808b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:white;border:1px solid #e0e9eb;border-radius:17px;padding:17px;margin-bottom:14px}.metric strong{display:block;font-size:23px;margin-top:8px}.muted{color:#627b85}.positive{color:#008b70}.negative{color:#c33f52}.button{border:0;background:#087e70;color:white;padding:11px 15px;border-radius:11px;font-weight:700}.button.secondary{background:#e3f3ee;color:#08695e}.button.danger{background:#ffe8e8;color:#a02d39}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionTitle h2{font-size:21px;margin:8px 0 15px}.entry{padding:13px 0;border-bottom:1px solid #e6eef0;display:flex;justify-content:space-between;gap:10px;align-items:center}.entry:last-child{border:0}.entry small{display:block;color:#627b85;margin-top:5px}.entry strong{font-size:15px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#355463;font-size:14px}.form input,.form select{width:100%;background:white;color:#153441;border:1px solid #b9cfd1;border-radius:10px;padding:12px;min-width:0}.progress{background:#e1eeeb;height:10px;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#1ca88f}.hint{font-size:13px;color:#627b85}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-top:1px solid #d7e6e8;padding:8px 5px calc(9px + env(safe-area-inset-bottom,0px));z-index:100;box-shadow:0 -8px 25px #102f3c16}.bottom a{text-decoration:none;color:#617a84;text-align:center;font-size:11px;border-radius:12px;padding:8px 2px;min-width:0}.bottom a span{display:block;font-size:22px;margin-bottom:3px}.bottom a.active{background:#e0f5ee;color:#087e70;font-weight:700}.hidden{display:none!important}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#087e70;color:white;border-radius:12px;padding:12px 16px;z-index:200;max-width:90%}.desktop{display:none}@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{max-width:700px;left:50%;transform:translateX(-50%);border:1px solid #d7e6e8;border-radius:20px 20px 0 0}.form{grid-template-columns:repeat(2,1fr)}.form .wide{grid-column:1/-1}}.v4chart{display:flex;gap:12px;align-items:end;height:180px;padding:15px 0 0}.v4bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.v4bar>div{background:linear-gradient(#17ad92,#087e70);width:75%;min-height:3px;border-radius:7px 7px 0 0}.v4bar small{color:#637b85}.v4category{display:flex;justify-content:space-between;margin-top:14px}.v4filters{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.v4filters input,.v4filters select{padding:10px;border:1px solid #b9cfd1;border-radius:10px;min-width:0;background:white;color:#153441}.v4calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.v4calendar>b{text-align:center;padding:8px 0}.v4day{border:1px solid #e0e9eb;border-radius:8px;min-height:66px;padding:5px;overflow-wrap:anywhere}.v4day small{display:block;color:#087e70;font-size:9px;margin-top:4px}@media(max-width:480px){.v4day{min-height:55px;padding:3px}.v4calendar{gap:2px}} .v5dark{background:#101c23;color:#e5f5f2}.v5dark main{color:#e5f5f2}.v5dark .panel,.v5dark .hero,.v5dark .bottom{background:#20333d;color:#e5f5f2;border-color:#38525b}.v5dark .muted,.v5dark .hint,.v5dark small{color:#b2c9cf}.v5dark input,.v5dark select{background:#142832;color:white;border-color:#4a6670}.v5purple .button{background:#7545b6;color:white}.v5purple .progress span,.v5purple .v4bar>div{background:#9765d7}.v5purple .bottom a.active{background:#e8ddf7;color:#6235a0}.v5dark .entry{border-color:#39515c}.v5dark .button.secondary{background:#36535b;color:white}.v5dark .v4day{border-color:#405b65}.v5dark .v4filters input,.v5dark .v4filters select{background:#142832;color:white;border-color:#4a6670}.v5dark .metric strong{color:#e5f5f2}.v5AccountAssign{max-width:145px;padding:8px;border-radius:8px;border:1px solid #b9cfd1;background:white}#v5ReportMonth{padding:9px;border-radius:9px;border:1px solid #b9cfd1} .v6hero .progress{margin-top:18px}.v6stats{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}.v6stats span{font-size:12px}.v6stats b{display:block;font-size:16px}.v6controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.v6controls label{display:grid;gap:6px;font-size:12px}.v6controls input{width:100%;min-width:0;padding:10px;border:1px solid #b9cfd1;border-radius:10px}.v6week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.v6daybtn{border:1px solid #d6e4e6;border-radius:12px;background:transparent;color:inherit;min-width:0;padding:9px 3px;display:flex;flex-direction:column;gap:6px;align-items:center}.v6daybtn.selected{border-color:#0b947e;background:#dff6ee;color:#153441}.v6daybtn strong{font-size:11px}.v6daybtn small,.v6daybtn span{font-size:10px}.v6tip{padding:12px 0;border-bottom:1px solid #dce8e8}.v6tip:last-child{border:0}.v6tip p{margin:6px 0 0}.v6rowactions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.v6rowactions .button{padding:6px 8px;font-size:12px}@media(max-width:650px){.v6controls{grid-template-columns:1fr}.v6week{grid-template-columns:repeat(4,minmax(0,1fr))}.v6daybtn strong{font-size:11px}}.v5dark .v6daybtn.selected{background:#22594e;color:white}.v5dark .v6controls input{background:#142832;color:white;border-color:#4a6670} </style></head><body><header><h1>budget<span class="accent">flow.</span> <small style="font-size:12px;color:#80ddbf">FRESH 3.0</small></h1><p id="subtitle">Your money, made clearer.</p></header><main id="app"><div class="panel">Loading BudgetFlow…</div></main>
<nav class="bottom" aria-label="Primary navigation"><a href="#dashboard" data-route="dashboard"><span>⌂</span>Home</a><a href="#transactions" data-route="transactions"><span>⇄</span>Activity</a><a href="#daily" data-route="daily"><span>◷</span>Daily</a><a href="#budgets" data-route="budgets"><span>◉</span>Budgets</a><a href="#more" data-route="more"><span>☰</span>More</a></nav>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
const KEY='budgetflow-v1',types=['transactions','bills','budgets','savings','debts'];
const empty=()=>({transactions:[],bills:[],budgets:[],savings:[],debts:[]});
let data=empty(),route='dashboard',editing='';
try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&types.every(k=>Array.isArray(stored[k])))data=stored}catch(e){console.warn('Could not read saved data',e)}
const app=document.getElementById('app'),money=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(v)||0);
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const sum=(a,k='amount')=>a.reduce((n,x)=>n+(Number(x[k])||0),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const month=()=>today().slice(0,7);
const uuid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const categories=['Housing','Groceries','Transport','Eating out','Shopping','Entertainment','Health','Subscriptions','Salary','Other'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Unable to save in this browser')}render()}
function notify(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function heading(title,action){return '<div class="sectionTitle"><h2>'+title+'</h2>'+(action||'')+'</div>'}
function btn(text,action,style=''){return '<button class="button '+style+'" type="button" data-action="'+action+'">'+text+'</button>'}
function entry(title,subtitle,amount,kind,id){return '<div class="entry"><div><strong>'+safe(title)+'</strong><small>'+safe(subtitle)+'</small></div><div style="text-align:right"><strong>'+money(amount)+'</strong><div>'+btn('Delete','delete:'+kind+':'+id,'secondary')+'</div></div></div>'}
function progress(a,b){return '<div class="progress"><span style="width:'+Math.min(100,Math.max(0,b>0?a/b*100:0))+'%"></span></div>'}
function dashboard(){const tx=data.transactions.filter(x=>String(x.date).slice(0,7)===month()),inc=sum(tx.filter(x=>x.type==='income')),spent=sum(tx.filter(x=>x.type==='expense'));const metrics=[['Income',inc],['Spent',spent],['Bills',sum(data.bills)],['Available',inc-spent]];return '<div class="hero"><small>THIS MONTH · '+month()+'</small><strong>'+money(inc-spent)+'</strong><small>Income minus recorded expenses</small></div><div class="grid">'+metrics.map(x=>'<div class="panel metric"><span class="muted">'+x[0]+'</span><strong>'+money(x[1])+'</strong></div>').join('')+'</div><div class="panel">'+heading('Quick actions')+'<div class="actions">'+btn('+ Transaction','new:transactions')+btn('+ Bill','new:bills','secondary')+btn('+ Budget','new:budgets','secondary')+'</div></div><div class="panel">'+heading('Recent activity')+(tx.length?tx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5).map(x=>entry(x.title,x.category+' · '+x.date,(x.type==='income'?1:-1)*x.amount,'transactions',x.id)).join(''):'<p class="muted">Add your first transaction to start tracking.</p>')+'</div>'}
function listPage(kind,title){const names={transactions:'Transaction',bills:'Bill',budgets:'Budget',savings:'Savings goal',debts:'Debt'};let content='<div class="panel">'+heading(title,btn('+ Add '+names[kind],'new:'+kind))+(data[kind].length?data[kind].map(x=>{if(kind==='transactions')return entry(x.title,x.type+' · '+x.category+' · '+x.date,(x.type==='income'?1:-1)*x.amount,kind,x.id);if(kind==='bills')return entry(x.title,'Due day '+x.day+' each month',x.amount,kind,x.id);if(kind==='budgets'){const used=sum(data.transactions.filter(t=>t.type==='expense'&&t.category===x.category&&String(t.date).slice(0,7)===month()));return '<div class="entry"><div style="flex:1"><strong>'+safe(x.category)+'</strong><small>'+money(used)+' of '+money(x.limit)+' used</small>'+progress(used,x.limit)+'</div>'+btn('Delete','delete:budgets:'+x.id,'secondary')+'</div>'}if(kind==='savings')return '<div class="entry"><div style="flex:1"><strong>'+safe(x.title)+'</strong><small>'+money(x.saved)+' / '+money(x.target)+'</small>'+progress(x.saved,x.target)+btn('Add savings','adjust:savings:'+x.id,'secondary')+'</div>'+btn('Delete','delete:savings:'+x.id,'secondary')+'</div>';return '<div class="entry"><div><strong>'+safe(x.title)+'</strong><small>Monthly plan: '+money(x.payment)+'</small><strong>'+money(x.balance)+' remaining</strong></div><div>'+btn('Repay','adjust:debts:'+x.id,'secondary')+' '+btn('Delete','delete:debts:'+x.id,'danger')+'</div></div>'}).join(''):'<p class="muted">Nothing added yet. Tap Add to get started.</p>')+'</div>';return content}
function more(){return '<div class="panel">'+heading('More tools')+'<div class="actions">'+btn('Savings goals','route:savings')+btn('Debt tracker','route:debts')+btn('Settings & backup','route:settings','secondary')+'</div><p class="hint">All features are free. Your financial information stays in this browser.</p></div>'}
function settings(){return '<div class="panel">'+heading('Backup & privacy')+'<p class="muted">Data is stored only in this browser. It is not encrypted, does not sync across devices, and can be lost if browser storage is cleared. Export a backup regularly.</p><div class="actions">'+btn('Download backup','export')+btn('Restore backup','import','secondary')+btn('Erase local data','reset','danger')+'</div></div>'}
function input(label,name,type='text',attributes=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+attributes+' required></label>'}
function select(label,name,options){return '<label>'+label+'<select name="'+name+'">'+options.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('')+'</select></label>'}
function form(kind){let fields='';if(kind==='transactions')fields=select('Type','type',['expense','income'])+input('Description','title')+input('Amount (£)','amount','number','min="0.01" step="0.01"')+select('Category','category',categories)+input('Date','date','date','value="'+today()+'"');if(kind==='bills')fields=input('Bill name','title')+input('Monthly amount (£)','amount','number','min="0.01" step="0.01"')+input('Due day (1–31)','day','number','min="1" max="31"');if(kind==='budgets')fields=select('Category','category',categories)+input('Monthly limit (£)','limit','number','min="0.01" step="0.01"');if(kind==='savings')fields=input('Goal name','title')+input('Target (£)','target','number','min="0.01" step="0.01"')+input('Already saved (£)','saved','number','min="0" step="0.01"');if(kind==='debts')fields=input('Debt name','title')+input('Balance (£)','balance','number','min="0.01" step="0.01"')+input('Planned monthly repayment (£)','payment','number','min="0" step="0.01"');return '<div class="panel">'+heading('Add '+kind.replace('transactions','transaction'))+'<form id="entryForm" class="form" data-kind="'+kind+'">'+fields+'<div class="wide actions"><button type="submit" class="button">Save entry</button>'+btn('Cancel','cancel','secondary')+'</div></form></div>'}
function render(){const titles={dashboard:'Dashboard',transactions:'Transactions',bills:'Bills',budgets:'Budgets',savings:'Savings',debts:'Debts',settings:'Settings',more:'More'};document.getElementById('subtitle').textContent=titles[route]+' · Personal finance';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('active',a.dataset.route===(['savings','debts','settings'].includes(route)?'more':route)));app.innerHTML=(editing?form(editing):route==='dashboard'?dashboard():route==='more'?more():route==='settings'?settings():listPage(route,titles[route]));}
function navigate(next){const allowed=['dashboard','transactions','bills','budgets','more','savings','debts','settings','calendar'];if(!allowed.includes(next))next='dashboard';route=next;editing='';render();window.scrollTo(0,0)}
function handleAction(action){const [verb,kind,id]=action.split(':');if(verb==='route'){location.hash=kind;navigate(kind)}else if(verb==='new'){route=kind;editing=kind;render();window.scrollTo(0,0)}else if(verb==='cancel'){editing='';render()}else if(verb==='delete'){if(confirm('Delete this entry?')){data[kind]=data[kind].filter(x=>String(x.id)!==id);persist()}}else if(verb==='adjust'){const item=data[kind].find(x=>String(x.id)===id);if(!item)return;const raw=prompt(kind==='savings'?'How much to add (£)?':'Repayment amount (£)?');if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0){notify('Enter a valid amount');return}if(kind==='savings')item.saved=Math.round((Number(item.saved)+amount)*100)/100;else item.balance=Math.max(0,Math.round((Number(item.balance)-amount)*100)/100);persist()}else if(verb==='export'){const blob=new Blob([JSON.stringify({version:2,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='budgetflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}else if(verb==='import'){document.getElementById('backupFile').click()}else if(verb==='reset'){if(confirm('Erase all local BudgetFlow records?')){data=empty();persist()}}}
document.addEventListener('click',e=>{const link=e.target.closest('a[data-route]');if(link){e.preventDefault();location.hash=link.dataset.route;navigate(link.dataset.route);return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action)});
document.addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();const kind=e.target.dataset.kind,record={id:uuid()};new FormData(e.target).forEach((v,k)=>record[k]=v);for(const key of ['amount','limit','target','saved','balance','payment'])if(key in record){record[key]=Number(record[key]);if(!Number.isFinite(record[key])||record[key]<0){notify('Enter valid amounts');return}}if(kind==='budgets')data.budgets=data.budgets.filter(x=>x.category!==record.category);data[kind].push(record);editing='';persist();notify('Saved successfully')});
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('File too large');const parsed=JSON.parse(await file.text());if(!types.every(k=>Array.isArray(parsed[k])))throw Error('Invalid backup');if(confirm('Replace all existing data with this backup?')){data=Object.fromEntries(types.map(k=>[k,parsed[k]]));persist();notify('Backup restored')}}catch(err){notify('Restore failed: '+err.message)}finally{e.target.value=''}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));

/* BudgetFlow 4.0 enhancements: all original storage keys and routes preserved */
const v4key='budgetflow-v4-extras';
let extras={recurring:[],categories:[],lastBackup:null};
try{const e=JSON.parse(localStorage.getItem(v4key)||'null');if(e&&typeof e==='object')extras={...extras,...e}}catch(e){}
function saveExtras(){try{localStorage.setItem(v4key,JSON.stringify(extras))}catch(e){notify('Could not save extra settings')}}
function recurringDue(r){const start=String(r.start||today());const until=String(r.until||'9999-12-31');const dates=[];const limit=new Date(today()+'T12:00:00');const current=new Date(start+'T12:00:00');if(!Number.isFinite(current.getTime()))return dates;let count=0;while(current<=limit&&count++<600){const date=current.getFullYear()+'-'+String(current.getMonth()+1).padStart(2,'0')+'-'+String(current.getDate()).padStart(2,'0');if(date>until)break;dates.push(date);if(r.frequency==='weekly')current.setDate(current.getDate()+7);else if(r.frequency==='yearly')current.setFullYear(current.getFullYear()+1);else{const day=Number(start.slice(8,10));current.setDate(1);current.setMonth(current.getMonth()+1);const end=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();current.setDate(Math.min(day,end))}}return dates}
function syncRecurring(){let changed=false;for(const r of extras.recurring){for(const date of recurringDue(r)){if(!data.transactions.some(t=>t.recurringId===r.id&&t.date===date)){data.transactions.push({id:uuid(),title:r.title,amount:Number(r.amount),type:r.type,category:r.category,date,recurringId:r.id});changed=true}}}if(changed){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Could not save recurring entries')}}}
function barChart(rows){const max=Math.max(1,...rows.map(x=>x[1]));return '<div class="v4chart">'+rows.map(([label,value])=>'<div class="v4bar"><div style="height:'+Math.max(3,100*value/max)+'%"></div><small>'+safe(label)+'</small></div>').join('')+'</div>'}
function v4Dashboard(){const months=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});const rows=months.map(m=>[m.slice(5),sum(data.transactions.filter(t=>t.type==='expense'&&String(t.date).startsWith(m)))]);const thisMonth=data.transactions.filter(t=>String(t.date).startsWith(month()));const expenses=thisMonth.filter(t=>t.type==='expense');const groups=Object.entries(expenses.reduce((a,t)=>(a[t.category]=(a[t.category]||0)+Number(t.amount||0),a),{})).sort((a,b)=>b[1]-a[1]);return dashboard()+'<div class="panel">'+heading('Spending over 6 months')+barChart(rows)+'</div><div class="panel">'+heading('Where your money goes')+(groups.length?groups.map(([c,n])=>'<div class="v4category"><span>'+safe(c)+'</span><strong>'+money(n)+'</strong></div>'+progress(n,sum(expenses))).join(''):'<p class="muted">Record expenses to see your breakdown.</p>')+'</div>'}
function v4Transactions(){const q=String(v4Filter||'').toLowerCase(),matches=data.transactions.filter(t=>(String(t.title)+' '+String(t.category)).toLowerCase().includes(q)&&(!v4Type||t.type===v4Type)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return '<div class="panel">'+heading('Transactions',btn('+ Add','new:transactions'))+'<div class="v4filters"><input id="v4Search" placeholder="Search transactions" value="'+safe(v4Filter)+'" aria-label="Search transactions"><select id="v4Type" aria-label="Filter type"><option value="">All types</option><option value="expense" '+(v4Type==='expense'?'selected':'')+'>Expenses</option><option value="income" '+(v4Type==='income'?'selected':'')+'>Income</option></select></div>'+(matches.length?matches.map(t=>'<div class="entry"><div><strong>'+safe(t.title)+'</strong><small>'+safe(t.category)+' · '+safe(t.date)+(t.recurringId?' · Recurring':'')+'</small></div><div style="text-align:right"><strong>'+money(t.amount)+'</strong><div>'+btn('Edit','edit:transactions:'+t.id,'secondary')+' '+btn('Delete','delete:transactions:'+t.id,'danger')+'</div></div></div>').join(''):'<p class="muted">No matching transactions.</p>')+'</div><div class="panel">'+heading('Recurring transactions',btn('+ Schedule','newrecurring'))+(extras.recurring.length?extras.recurring.map(r=>'<div class="entry"><div><strong>'+safe(r.title)+'</strong><small>'+safe(r.frequency)+' · '+safe(r.start)+'</small></div><div>'+money(r.amount)+' '+btn('Remove','removerecurring:'+r.id,'secondary')+'</div></div>').join(''):'<p class="muted">Schedule income or spending to be added when you open the app.</p>')+'</div>'}
let v4Filter='',v4Type='',v4EditId=null;

function v5Forecast(){const start=new Date(today()+'T12:00:00');const balance=v5.accounts.reduce((n,a)=>n+v5AccountBalance(a),0);const scheduled=extras.recurring||[];const days=[7,30,90];let output='<div class="panel">'+heading('Cash flow forecast')+'<p class="hint">Estimates from recorded account balances, recurring schedules and upcoming bills. Bills are treated as projected expenses; actual payments are not automatically matched.</p><div class="grid">';

output+='<div class="panel metric"><span class="muted">'+horizon+' days</span><strong>'+money(balance+delta)+'</strong><small class="'+(delta<0?'negative':'positive')+'">Projected change '+money(delta)+'</small></div>'}
return output+'</div></div>'}
function v5Insights(){const tx=data.transactions.filter(t=>t.type==='expense'),current=tx.filter(t=>String(t.date).startsWith(month())),prev=new Date();prev.setDate(1);prev.setMonth(prev.getMonth()-1);const previous=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0'),old=tx.filter(t=>String(t.date).startsWith(previous)),cur=sum(current),prior=sum(old),top=Object.entries(current.reduce((a,t)=>(a[t.category]=(a[t.category]||0)+Number(t.amount||0),a),{})).sort((a,b)=>b[1]-a[1]),big=current.slice().sort((a,b)=>Number(b.amount)-Number(a.amount))[0];return '<div class="panel">'+heading('Spending insights')+'<div class="grid"><div class="panel metric"><span class="muted">This month</span><strong>'+money(cur)+'</strong></div><div class="panel metric"><span class="muted">Previous month</span><strong>'+money(prior)+'</strong></div></div>'+(prior?'<p class="muted">Spending '+(cur>=prior?'increased':'decreased')+' by '+money(Math.abs(cur-prior))+' compared with last month so far. Full-month comparisons may be misleading mid-month.</p>':'<p class="muted">Add last month’s spending for a month-on-month comparison.</p>')+(top.length?'<p><strong>Biggest category:</strong> '+safe(top[0][0])+' ('+money(top[0][1])+')</p>':'')+(big?'<p><strong>Largest expense:</strong> '+safe(big.title)+' ('+money(big.amount)+')</p>':'')+'<p class="hint">Insights are calculated locally from recorded transactions, not generated by an external AI service.</p></div>'}

function v5DebtPlanner(){const debts=data.debts.slice().map(d=>({...d,rate:Number(v5.debtRates[d.id]||0)}));const total=debts.reduce((n,d)=>n+Number(d.balance||0),0);function simulate(order){const ds=debts.slice().sort(order).map(d=>({...d,balance:Number(d.balance)||0}));const monthly=sum(ds,'payment');if(monthly<=0)return null;let interest=0,months=0;while(ds.some(d=>d.balance>0.005)&&months<600){months++;for(const d of ds){if(d.balance>0){const cost=d.balance*d.rate/1200;d.balance+=cost;interest+=cost}}let left=monthly;for(const d of ds){const pay=Math.min(left,d.balance);d.balance-=pay;left-=pay;if(left<=0)break}if(months>1&&ds.reduce((n,d)=>n+d.balance,0)>total+monthly*months)return null}return months>=600?null:{months,interest}}

const v5PriorAction=handleAction;
handleAction=function(value){const [verb,kind,id]=value.split(':');if(verb==='v5new'){editing='v5:'+kind;render();return}if(verb==='v5del'){if(confirm('Remove this '+kind+'?')){const field=kind==='subscription'?'subscriptions':'challenges';v5[field]=v5[field].filter(x=>x.id!==id);v5Save()}return}if(verb==='v5add'){const c=v5.challenges.find(x=>x.id===id);if(!c)return;const raw=prompt('Amount saved (£)');if(raw===null)return;const n=Number(raw);if(n>0&&Number.isFinite(n)){c.saved+=n;v5Save()}return}if(verb==='v5rate'){const raw=prompt('Annual interest rate (APR %)',String(v5.debtRates[id]||0));if(raw===null)return;const n=Number(raw);if(n>=0&&n<=100&&Number.isFinite(n)){v5.debtRates[id]=n;v5Save()}return}if(verb==='v5theme'){v5.theme=kind;v5Save();return}if(verb==='v5accent'){v5.accent=kind;v5Save();return}if(verb==='v5export'){v5Download(JSON.stringify({version:5,transactions:data.transactions,bills:data.bills,budgets:data.budgets,savings:data.savings,debts:data.debts,extras,v5},null,2),'budgetflow-complete-v5-'+today()+'.json','application/json');return}if(verb==='v5import'){document.getElementById('backupFile').click();return}if(verb==='v5reportcsv'){const t=data.transactions.filter(x=>String(x.date).startsWith(v5.reportMonth)),rows=[['Date','Type','Description','Category','Amount'],...t.map(x=>[x.date,x.type,x.title,x.category,x.amount])];v5Download(rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'budgetflow-report-'+v5.reportMonth+'.csv','text/csv');return}v5PriorAction(value)};
document.addEventListener('change',e=>{if(e.target.id==='v5ReportMonth'){v5.reportMonth=e.target.value;v5Save()}if(e.target.classList.contains('v5AccountAssign')){v5.transactionAccounts[e.target.dataset.id]=e.target.value;v5Save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='v5Form')return;e.preventDefault();e.stopImmediatePropagation();const kind=e.target.dataset.kind,x={id:uuid()};new FormData(e.target).forEach((v,k)=>x[k]=v);for(const k of ['amount','opening','target'])if(k in x){x[k]=Number(x[k]);if(!Number.isFinite(x[k])||(k!=='opening'&&x[k]<=0))return notify('Enter a valid amount')}if(kind==='account')v5.accounts.push(x);if(kind==='subscription')v5.subscriptions.push(x);if(kind==='challenge'){x.saved=0;v5.challenges.push(x)}if(kind==='transfer'){if(x.from===x.to)return notify('Choose two different accounts');if(!v5.accounts.some(a=>a.id===x.from)||!v5.accounts.some(a=>a.id===x.to))return notify('Invalid accounts');v5.transfers.push(x)}editing='';v5Save();notify('Saved')},true);
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version===5&&d.v5&&Array.isArray(d.v5.accounts)&&confirm('Restore BudgetFlow 5.0 accounts, recurring schedules and preferences?')){v5={...v5Default(),...d.v5};if(d.extras&&Array.isArray(d.extras.recurring)){extras={...extras,...d.extras};saveExtras()}v5Save()}}catch(err){}},true);
v5ApplyTheme();


/* BudgetFlow 6.0 — daily money manager. Uses existing transaction ledger, no duplicate expenses. */
const v6Key='budgetflow-v6-extras';
let v6={dailyLimit:25,overrides:{},tags:{},notes:{},lastCategory:'Food',coachMode:'balanced'};
try{const stored=JSON.parse(localStorage.getItem(v6Key)||'null');if(stored&&typeof stored==='object')v6={...v6,...stored}}catch(e){}
function v6Save(){try{localStorage.setItem(v6Key,JSON.stringify(v6))}catch(e){notify('Could not save daily budget settings')}render()}
const v6Day=()=>today();
const v6Expenses=(day)=>data.transactions.filter(t=>t.type==='expense'&&t.date===day);
const v6Spent=(day)=>sum(v6Expenses(day));
const v6Limit=(day)=>Number(v6.overrides[day]??v6.dailyLimit);
const v6Classification=t=>v6.tags[t.id]||'unclassified';
const v6Categories=()=>Array.from(new Set([...categories,...data.transactions.map(t=>t.category).filter(Boolean)]));
function v6Daily(){const day=v6SelectedDay,items=v6Expenses(day),limit=v6Limit(day),spent=sum(items),left=limit-spent,percentage=limit>0?Math.min(100,spent/limit*100):100;const past=Array.from({length:7},(_,i)=>{const d=new Date(day+'T12:00:00');d.setDate(d.getDate()-(6-i));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});return '<div class="hero v6hero"><small>DAILY MONEY MANAGER · '+safe(day)+'</small><strong>'+money(left)+'</strong><small>'+(left<0?'Over daily budget by '+money(-left):'Remaining to spend today')+'</small>'+progress(spent,limit)+'<div class="v6stats"><span>Daily limit <b>'+money(limit)+'</b></span><span>Spent <b>'+money(spent)+'</b></span><span>Used <b>'+Math.round(percentage)+'%</b></span></div></div><div class="panel">'+heading('Daily controls')+'<div class="v6controls"><label>View date<input type="date" id="v6Date" value="'+safe(day)+'" max="'+today()+'"></label><label>Default daily budget (£)<input id="v6Default" type="number" min="0.01" step="0.01" value="'+safe(v6.dailyLimit)+'"></label><label>Budget for this date (£)<input id="v6Override" type="number" min="0.01" step="0.01" value="'+safe(limit)+'"></label></div><div class="actions">'+btn('Save daily settings','v6save','secondary')+btn('Use default for this date','v6clear','secondary')+'</div></div><div class="panel">'+heading('Quick expense',btn('Spending tracker','route:spending','secondary'))+v6ExpenseForm()+'</div><div class="panel">'+heading('Spending on '+safe(day))+(items.length?items.map(t=>v6ExpenseRow(t)).join(''):'<p class="muted">No expenses recorded for this day.</p>')+'</div><div class="panel">'+heading('Last 7 days')+'<div class="v6week">'+past.map(d=>{const n=v6Spent(d),l=v6Limit(d);return '<button class="v6daybtn '+(d===day?'selected':'')+'" data-action="v6date:'+d+'"><small>'+d.slice(5)+'</small><strong>'+money(n)+'</strong><span class="'+(n>l?'negative':'positive')+'">'+(n>l?'Over':'Within')+'</span></button>'}).join('')+'</div></div>'+v6CoachPanel()}
function v6ExpenseForm(){return '<form id="v6ExpenseForm" class="form"><label>Description<input name="title" required maxlength="100" placeholder="e.g. Lunch, coffee, groceries"></label><label>Amount (£)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Category<select name="category">'+v6Categories().map(c=>'<option value="'+safe(c)+'" '+(v6.lastCategory===c?'selected':'')+'>'+safe(c)+'</option>').join('')+'</select></label><label>Purchase type<select name="need"><option value="essential">Essential</option><option value="optional">Optional</option><option value="avoidable">Could avoid</option></select></label><label>Date<input name="date" type="date" value="'+safe(v6SelectedDay)+'" max="'+today()+'" required></label><label>Account<select name="account">'+v5.accounts.map(a=>'<option value="'+safe(a.id)+'">'+safe(a.name)+'</option>').join('')+'</select></label><label class="wide">Notes (optional)<input name="notes" maxlength="180" placeholder="Why did you buy it?"></label><div class="wide actions"><button type="submit" class="button">+ Log expense</button></div></form>'}
function v6ExpenseRow(t){return '<div class="entry"><div style="flex:1"><strong>'+safe(t.title)+'</strong><small>'+safe(t.category)+' · '+safe(t.date)+' · '+safe(v6Classification(t))+'</small>'+(v6.notes[t.id]?'<small>'+safe(v6.notes[t.id])+'</small>':'')+'</div><div class="v6rowactions"><strong>'+money(t.amount)+'</strong>'+btn('Edit','edit:transactions:'+t.id,'secondary')+btn('Delete','delete:transactions:'+t.id,'secondary')+'</div></div>'}
let v6SelectedDay=today(),v6SpendFilter='all';
function v6Spending(){const tx=data.transactions.filter(t=>t.type==='expense').filter(t=>v6SpendFilter==='all'||v6Classification(t)===v6SpendFilter).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const current=tx.filter(t=>String(t.date).startsWith(month()));const groups=Object.entries(current.reduce((a,t)=>(a[t.category]=(a[t.category]||0)+Number(t.amount||0),a),{})).sort((a,b)=>b[1]-a[1]);const avoidable=sum(current.filter(t=>v6Classification(t)==='avoidable')),optional=sum(current.filter(t=>v6Classification(t)==='optional'));return '<div class="panel">'+heading('Spending tracker',btn('+ Log spending','route:daily'))+'<div class="grid"><div class="panel metric"><span class="muted">Shown expenses</span><strong>'+money(sum(tx))+'</strong></div><div class="panel metric"><span class="muted">Potential review this month</span><strong>'+money(avoidable+optional)+'</strong></div></div><p class="hint">The review amount includes purchases you labelled optional or avoidable. It is not a guaranteed saving.</p><label>Filter spending<select id="v6Filter"><option value="all" '+(v6SpendFilter==='all'?'selected':'')+'>All purchases</option>'+['essential','optional','avoidable','unclassified'].map(x=>'<option value="'+x+'" '+(v6SpendFilter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+(tx.length?tx.slice(0,100).map(t=>v6ExpenseRow(t)).join(''):'<p class="muted">No expenses match this filter.</p>')+'</div><div class="panel">'+heading('Top spending categories this month')+(groups.length?groups.map(([c,n])=>'<div class="v4category"><span>'+safe(c)+'</span><strong>'+money(n)+'</strong></div>'+progress(n,sum(current))).join(''):'<p class="muted">No spending in this category yet.</p>')+'</div>'+v6CoachPanel()}
function v6CoachTips(){const current=data.transactions.filter(t=>t.type==='expense'&&String(t.date).startsWith(month()));const spent=sum(current),todaySpent=v6Spent(today()),limit=v6Limit(today()),avoidable=sum(current.filter(t=>v6Classification(t)==='avoidable')),optional=sum(current.filter(t=>v6Classification(t)==='optional'));const groups=Object.entries(current.reduce((a,t)=>(a[t.category]=(a[t.category]||0)+Number(t.amount||0),a),{})).sort((a,b)=>b[1]-a[1]);const tips=[];if(todaySpent>limit)tips.push(['Today’s limit exceeded','You are '+money(todaySpent-limit)+' over your daily target. Prioritise essentials for the rest of today and consider adjusting your budget if it is unrealistic.']);else if(todaySpent>=limit*.8)tips.push(['Close to your daily limit','You have '+money(Math.max(0,limit-todaySpent))+' remaining today. Consider delaying optional purchases until you review your needs.']);else tips.push(['Your daily allowance','You have '+money(limit-todaySpent)+' remaining today. Keep room for necessities and unexpected costs.']);if(avoidable>0)tips.push(['Potential savings','You marked '+money(avoidable)+' of purchases this month as avoidable. Reviewing those could free up money, but only you can decide what to cut.']);if(optional>0)tips.push(['Review optional spending','Optional spending is '+money(optional)+' this month. Cutting 25% of that would free up about '+money(optional*.25)+' this month.']);if(groups.length)tips.push(['Biggest spending category','Your largest recorded expense category this month is '+groups[0][0]+' at '+money(groups[0][1])+'. Check whether any recurring purchases in this category can be reduced.']);if(!current.length)tips.push(['Start tracking','Log a few purchases to receive more useful recommendations based on your actual spending.']);return tips}
function v6CoachPanel(){return '<div class="panel">'+heading('BudgetFlow Coach')+'<p class="hint">Guidance is based on your logged transactions, not a paid AI service. Essentials should always take priority over arbitrary spending limits.</p>'+v6CoachTips().map(([name,tip])=>'<div class="v6tip"><strong>'+safe(name)+'</strong><p>'+safe(tip)+'</p></div>').join('')+'</div>'}
function v6Coach(){const tx=data.transactions.filter(t=>t.type==='expense'&&String(t.date).startsWith(month()));const needs=sum(tx.filter(t=>v6Classification(t)==='essential')),wants=sum(tx.filter(t=>v6Classification(t)==='optional')),avoidable=sum(tx.filter(t=>v6Classification(t)==='avoidable'));return '<div class="panel">'+heading('Monthly spending priorities')+'<div class="grid">'+[['Essential',needs],['Optional',wants],['Could avoid',avoidable]].map(([name,n])=>'<div class="panel metric"><span class="muted">'+name+'</span><strong>'+money(n)+'</strong></div>').join('')+'</div><p class="hint">These labels are assigned by you. Unclassified transactions are excluded from this breakdown.</p></div>'+v6CoachPanel()+'<div class="panel">'+heading('Potential monthly savings')+'<p>Reducing your labelled optional spending by 25% and avoidable spending by 50% could save approximately <strong>'+money(wants*.25+avoidable*.5)+'</strong> based on this month’s entries.</p><p class="hint">This is a hypothetical calculation, not a recommendation to skip necessities or a guarantee of savings.</p></div>'}
const v6PreviousRender=render;
render=function(){if(['daily','spending','coach'].includes(route)){v5ApplyTheme();document.getElementById('subtitle').textContent=({daily:'Daily budget',spending:'Spending tracker',coach:'Budgeting coach'})[route]+' · BudgetFlow 6.0';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('active',a.dataset.route===(route==='daily'?'daily':'more')));app.innerHTML=route==='daily'?v6Daily():route==='spending'?v6Spending():v6Coach();return}v6PreviousRender();if(!editing&&route==='more')app.innerHTML+='<div class="panel">'+heading('Daily money manager')+'<div class="actions">'+btn('Monthly budgets','route:budgets','secondary')+btn('Daily budget','route:daily')+btn('Spending tracker','route:spending','secondary')+btn('BudgetFlow Coach','route:coach','secondary')+'</div></div>';if(!editing&&route==='settings')app.innerHTML+='<div class="panel">'+heading('Daily budgeting data')+'<p class="hint">Your daily limits and spending labels are saved locally. Use the BudgetFlow 6.0 complete backup to preserve them.</p>'+btn('Download 6.0 backup','v6export')+'</div>'};
const v6PreviousNavigate=navigate;
navigate=function(next){if(['daily','spending','coach'].includes(next)){route=next;editing='';render();window.scrollTo(0,0)}else v6PreviousNavigate(next)};
const v6PreviousAction=handleAction;
handleAction=function(action){const [verb,kind]=action.split(':');if(verb==='v6date'){v6SelectedDay=kind;render();return}if(verb==='v6save'){const base=Number(document.getElementById('v6Default').value),day=Number(document.getElementById('v6Override').value);if(!Number.isFinite(base)||base<=0||!Number.isFinite(day)||day<=0)return notify('Enter valid daily budgets');v6.dailyLimit=base;v6.overrides[v6SelectedDay]=day;v6Save();notify('Daily budget saved');return}if(verb==='v6clear'){delete v6.overrides[v6SelectedDay];v6Save();return}if(verb==='v6export'){v5Download(JSON.stringify({version:6,...data,extras,v5,v6},null,2),'budgetflow-complete-v6-'+today()+'.json','application/json');return}v6PreviousAction(action)};
document.addEventListener('change',e=>{if(e.target.id==='v6Date'){v6SelectedDay=e.target.value;render()}if(e.target.id==='v6Filter'){v6SpendFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='v6ExpenseForm')return;e.preventDefault();e.stopImmediatePropagation();const fields=Object.fromEntries(new FormData(e.target));const amount=Number(fields.amount);if(!Number.isFinite(amount)||amount<=0||!fields.title.trim()||!fields.date||fields.date>today())return notify('Check expense details');const id=uuid();data.transactions.push({id,title:fields.title.trim(),amount,type:'expense',category:fields.category,date:fields.date});v6.tags[id]=fields.need;v6.notes[id]=fields.notes||'';v6.lastCategory=fields.category;v5.transactionAccounts[id]=v5.accounts.some(a=>a.id===fields.account)?fields.account:'main';try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(v5Key,JSON.stringify(v5));localStorage.setItem(v6Key,JSON.stringify(v6))}catch(err){notify('Saving failed; export your records');return}render();notify('Expense logged')},true);
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version===6&&d.v6&&typeof d.v6==='object'&&confirm('Restore BudgetFlow 6.0 settings, accounts, recurring schedules and spending labels?')){v6={...v6,...d.v6};if(d.v5&&Array.isArray(d.v5.accounts))v5={...v5,...d.v5};if(d.extras&&Array.isArray(d.extras.recurring))extras={...extras,...d.extras};try{localStorage.setItem(v6Key,JSON.stringify(v6));localStorage.setItem(v5Key,JSON.stringify(v5));localStorage.setItem(v4key,JSON.stringify(extras))}catch(err){notify('Could not save restored settings')}render()}}catch(err){}},true);


/* BudgetFlow 6.1 monthly commitments: existing bills/subscriptions are read, not copied */
const monthlyKey='budgetflow-monthly-v1';
let monthly={items:[],view:month(),income:0};
try{const x=JSON.parse(localStorage.getItem(monthlyKey)||'null');if(x&&typeof x==='object')monthly={...monthly,...x};if(!Array.isArray(monthly.items))monthly.items=[]}catch(e){}
function monthlySave(){try{localStorage.setItem(monthlyKey,JSON.stringify(monthly))}catch(e){notify('Could not save monthly tracker')}render()}
function monthlyCost(x){const a=Number(x.amount)||0;return a*(x.frequency==='weekly'?52/12:x.frequency==='yearly'?1/12:x.frequency==='quarterly'?1/3:1)}
function monthlyRows(){return [...data.bills.map(b=>({id:b.id,source:'bill',title:b.title,amount:b.amount,frequency:'monthly',day:b.day||1,category:'Bills'})),...v5.subscriptions.map(x=>({id:x.id,source:'subscription',title:x.title,amount:x.amount,frequency:x.frequency||'monthly',day:Number(String(x.nextDate||'').slice(8,10))||1,category:'Subscriptions'})),...monthly.items.map(x=>({...x,source:'monthly'}))]}
function monthlyPage(){const rows=monthlyRows(),total=rows.reduce((n,x)=>n+monthlyCost(x),0),current=data.transactions.filter(t=>String(t.date).startsWith(monthly.view)),income=sum(current.filter(t=>t.type==='income')),recorded=sum(current.filter(t=>t.type==='expense')),budgetIncome=income||Number(monthly.income)||0,remaining=budgetIncome-total;const cats=Object.entries(rows.reduce((a,x)=>(a[x.category||'Other']=(a[x.category||'Other']||0)+monthlyCost(x),a),{})).sort((a,b)=>b[1]-a[1]);return '<div class="hero"><small>MONTHLY SPENDING HQ · '+safe(monthly.view)+'</small><strong>'+money(total)+'</strong><small>Estimated monthly fixed commitments</small><div class="v6stats"><span>Monthly income <b>'+money(budgetIncome)+'</b></span><span>After commitments <b>'+money(remaining)+'</b></span><span>Recorded expenses <b>'+money(recorded)+'</b></span></div></div><div class="panel">'+heading('Monthly overview')+'<div class="v6controls"><label>View month<input id="monthlyView" type="month" value="'+safe(monthly.view)+'"></label><label>Expected monthly income (£)<input id="monthlyIncome" type="number" min="0" step="0.01" value="'+safe(monthly.income)+'"></label></div><p class="hint">Recorded income for the selected month takes priority over the optional income estimate. Fixed commitments are projections, not extra transactions; recorded expenses are shown separately to avoid double counting.</p>'+btn('Save income estimate','monthlyincome','secondary')+'</div><div class="panel">'+heading('Add monthly commitment')+'<form id="monthlyForm" class="form"><label>Name<input name="title" maxlength="100" required placeholder="Rent, phone, electricity..."></label><label>Amount (£)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Category<select name="category">'+['Rent','Mortgage','Utilities','Subscriptions','Insurance','Transport','Council tax','Groceries','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Frequency<select name="frequency">'+['monthly','weekly','quarterly','yearly'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Due day (1–31)<input name="day" type="number" min="1" max="31" value="1" required></label><div class="wide actions"><button class="button" type="submit">+ Add commitment</button></div></form></div><div class="panel">'+heading('Your monthly commitments')+(rows.length?rows.map(x=>'<div class="entry"><div style="flex:1"><strong>'+safe(x.title)+'</strong><small>'+safe(x.category||'Bills')+' · '+safe(x.frequency)+' · Due day '+safe(x.day||1)+(x.source!=='monthly'?' · From '+safe(x.source):'')+'</small></div><div class="v6rowactions"><strong>'+money(monthlyCost(x))+'/mo</strong>'+(x.source==='monthly'?btn('Remove','monthlydelete:'+x.id,'secondary'):'')+'</div></div>').join(''):'<p class="muted">No monthly commitments yet. Existing bills and subscriptions will appear here automatically.</p>')+'</div><div class="panel">'+heading('Commitments by category')+(cats.length?cats.map(([c,n])=>'<div class="v4category"><span>'+safe(c)+'</span><strong>'+money(n)+'</strong></div>'+progress(n,total)).join(''):'<p class="muted">Add commitments to see a breakdown.</p>')+'</div>'}
const monthlyPreviousRender=render;
render=function(){if(route==='monthly'){v5ApplyTheme();document.getElementById('subtitle').textContent='Monthly Spending · BudgetFlow';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('active',a.dataset.route==='more'));app.innerHTML=monthlyPage();return}monthlyPreviousRender();if(!editing&&route==='more')app.innerHTML+='<div class="panel">'+heading('Monthly spending')+'<p class="muted">Manage rent, subscriptions and fixed bills together.</p>'+btn('Open Monthly Spending HQ','route:monthly')+'</div>';if(!editing&&route==='settings')app.innerHTML+='<div class="panel">'+heading('Monthly spending backup')+'<p class="hint">Download a complete backup including monthly commitments and your existing records.</p>'+btn('Download full backup','monthlyexport')+'</div>'};
const monthlyPreviousNavigate=navigate;
navigate=function(p){if(p==='monthly'){route=p;editing='';render();window.scrollTo(0,0)}else monthlyPreviousNavigate(p)};
const monthlyPreviousAction=handleAction;
handleAction=function(action){const [verb,id]=action.split(':');if(verb==='monthlydelete'){if(confirm('Remove this monthly commitment?')){monthly.items=monthly.items.filter(x=>x.id!==id);monthlySave()}return}if(verb==='monthlyincome'){const n=Number(document.getElementById('monthlyIncome').value);if(!Number.isFinite(n)||n<0)return notify('Enter a valid income');monthly.income=n;monthlySave();return}if(verb==='monthlyexport'){v5Download(JSON.stringify({version:6.1,...data,extras,v5,v6,monthly},null,2),'budgetflow-full-backup-'+today()+'.json','application/json');return}monthlyPreviousAction(action)};
document.addEventListener('change',e=>{if(e.target.id==='monthlyView'&&/^\d{4}-\d{2}$/.test(e.target.value)){monthly.view=e.target.value;monthlySave()}});
document.addEventListener('submit',e=>{if(e.target.id!=='monthlyForm')return;e.preventDefault();e.stopImmediatePropagation();const x={id:uuid(),...Object.fromEntries(new FormData(e.target))};x.amount=Number(x.amount);x.day=Number(x.day);if(!x.title.trim()||!Number.isFinite(x.amount)||x.amount<=0||x.day<1||x.day>31)return notify('Check commitment details');monthly.items.push(x);monthlySave();notify('Monthly commitment added')},true);
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version===6.1&&d.monthly&&Array.isArray(d.monthly.items)&&confirm('Restore monthly commitments from this backup?')){monthly={...monthly,...d.monthly};monthlySave()}}catch(err){}},true);

navigate(location.hash.slice(1)||'dashboard');
})();
</script></body></html>
