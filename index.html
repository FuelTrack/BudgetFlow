
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b20"><title>BudgetFlow v1.0.7 | Personal Finance</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f5f1ff;background:#0e0a1b;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#151025;border-right:1px solid #302444;padding:26px 16px}.brand{font-size:24px;font-weight:850;margin:0 10px 32px}.brand span{color:#ae84ff}.nav{width:100%;text-align:left;border:0;color:#c5b9db;background:transparent;border-radius:12px;padding:13px;margin:3px 0}.nav.active,.nav:hover{background:#42246e;color:white}.main{max-width:1300px;width:100%;margin:auto;padding:30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#ab9dbf}.btn{background:linear-gradient(120deg,#9b5bfa,#6f3cc9);color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:650}.btn.secondary{background:#2c2240}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.card,.panel{background:linear-gradient(145deg,#211633,#191326);border:1px solid #392b4e;border-radius:18px;padding:22px}.card strong{display:block;font-size:27px;margin-top:12px}.positive{color:#6be3ac}.negative{color:#ff929e}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.panel{margin-bottom:18px}h1{margin:4px 0;font-size:30px}h2{font-size:19px;margin:0 0 17px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.bar{height:12px;border-radius:20px;background:#392b4e;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7d49dd,#bb8eff);border-radius:20px}.item{padding:13px 0;border-bottom:1px solid #392b4e}.item:last-child{border-bottom:0}.pill{font-size:12px;background:#38284d;border-radius:50px;padding:5px 9px}.empty{padding:25px;text-align:center;color:#ab9dbf}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{display:grid;gap:6px;font-size:13px;color:#cbbfe0}.form input,.form select{width:100%;background:#120e20;color:white;border:1px solid #514063;border-radius:9px;padding:11px;min-width:0}.form .full{grid-column:1/-1}.hide{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.danger{background:#542638!important}.banner{padding:12px;border:1px solid #644e88;background:#271b3b;border-radius:12px;margin:18px 0}.mobilebar{display:none}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{display:none}.main{padding:20px 16px 90px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#171025;border-top:1px solid #42305a;overflow-x:auto;padding:8px;z-index:10}.mobilebar button{flex:1;min-width:75px;border:0;background:none;color:#c5b9db;font-size:11px;padding:9px 3px}.mobilebar button.active{color:#c295ff}}@media(max-width:520px){.cards{gap:9px}.card{padding:15px}.card strong{font-size:21px}.form{grid-template-columns:1fr}.main{padding-top:18px}}
@media(max-width:950px){.mobilebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;padding:5px 5px max(5px,env(safe-area-inset-bottom));gap:2px}.mobilebar button{min-width:0;padding:8px 1px;font-size:10px}.main{padding-bottom:115px}}.quicklinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 24px}.quicklink{border:1px solid #4c3768;background:linear-gradient(145deg,#302044,#1d1530);color:#f6efff;border-radius:14px;padding:17px 9px;text-align:center;font-weight:650}.quicklink span{display:block;font-size:24px;margin-bottom:8px}.quicklink:hover{border-color:#b98cff}.menuButton{display:none}@media(max-width:950px){.menuButton{display:inline-flex}.quicklinks{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.quicklink{font-size:13px;padding:14px 6px}} /* BudgetFlow persistent mobile bottom navigation */
@media(max-width:950px){.mobilebar{display:flex!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;width:100%!important;z-index:100!important;grid-template-columns:none!important;overflow:visible!important;align-items:stretch;justify-content:space-around;gap:0;padding:7px 4px calc(8px + env(safe-area-inset-bottom,0px))!important;background:#171025!important;border-top:1px solid #5b3c80;box-shadow:0 -9px 30px #0007}.mobilebar button{flex:1 1 0!important;min-width:0!important;max-width:none!important;padding:7px 1px!important;border:0;border-radius:10px;background:transparent;color:#b9a8d2;font-size:10px!important;line-height:1.25;white-space:nowrap}.mobilebar button .tabIcon{display:block;font-size:21px;line-height:26px;margin-bottom:2px}.mobilebar button.active{background:#3b245b!important;color:#d9baff!important;font-weight:700}.main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))!important}}@media(min-width:951px){.mobilebar{display:none!important}} /* Static mobile tab bar: visible even if app JS fails */ @media(max-width:950px){html body #mobileNav.mobilebar{display:flex!important;visibility:visible!important;opacity:1!important;position:fixed!important;inset:auto 0 0 0!important;z-index:2147483000!important;flex-direction:row!important;grid-template-columns:none!important;overflow:visible!important;background:#171025!important;border-top:2px solid #9b5bfa!important;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))!important}#mobileNav.mobilebar button{display:block!important;flex:1 1 0!important;min-width:0!important;width:auto!important;font-size:10px!important;color:#d4c4ea!important}#mobileNav.mobilebar button.active{color:#fff!important;background:#49306b!important}body .main{padding-bottom:125px!important}} @media(max-width:950px){#mobileNav.mobilebar .mobileTab{display:block!important;flex:1 1 0!important;min-width:0!important;padding:7px 1px!important;text-decoration:none!important;text-align:center!important;font-size:10px!important;color:#d4c4ea!important;border-radius:10px}#mobileNav.mobilebar .mobileTab.active{background:#49306b!important;color:#fff!important}#mobileNav.mobilebar .mobileTab .tabIcon{display:block;font-size:21px;line-height:26px}} </style></head><body><div class="shell"><aside class="side"><div class="brand">◈ Budget<span>Flow</span></div><div id="desktopNav"></div><p class="muted small" style="padding:14px">Private, local-first budgeting<br>Version 1.0</p></aside><main class="main"><header class="top"><div><div class="muted small">PERSONAL FINANCE</div><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn secondary menuButton" onclick="toggleMenu()">☰ All sections</button><button class="btn" onclick="openTransaction()">+ Add transaction</button></div></header><div id="appStatus" class="small" style="color:#d9baff;padding:5px 0">Loading app…</div><div class="banner small">🔒 Your entries stay in this browser. Export a backup regularly; clearing browser data can erase them.</div><div id="content"></div></main></div><nav id="mobileNav" class="mobilebar" aria-label="Main navigation"><a href="#Dashboard" class="mobileTab" data-page="Dashboard"><span class="tabIcon">⌂</span>Home</a><a href="#Transactions" class="mobileTab" data-page="Transactions"><span class="tabIcon">⇄</span>Activity</a><a href="#Bills" class="mobileTab" data-page="Bills"><span class="tabIcon">▣</span>Bills</a><a href="#Budgets" class="mobileTab" data-page="Budgets"><span class="tabIcon">◉</span>Budgets</a><a href="#Savings" class="mobileTab" data-page="Savings"><span class="tabIcon">✦</span>Savings</a><a href="#More" class="mobileTab" data-page="More"><span class="tabIcon">☰</span>More</a></nav><div id="allMenu" class="hide" style="position:fixed;inset:0;background:#080510df;z-index:30;padding:22px;overflow:auto"><div class="panel" style="max-width:480px;margin:8vh auto"><div class="row"><h2>All BudgetFlow sections</h2><button class="btn secondary" onclick="toggleMenu()">✕ Close</button></div><div id="menuLinks" class="quicklinks"></div></div></div><input type="file" id="importFile" accept="application/json" hidden><script>
'use strict';const KEY='budgetflow-v1';const pages=['Dashboard','Transactions','Bills','Budgets','Savings','Debts','Settings'];const icons=['◈','↔','▣','◉','✦','⇣','⚙'];let page='Dashboard';let data=load();function fresh(){return {transactions:[],bills:[],budgets:[],savings:[],debts:[]}}function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&['transactions','bills','budgets','savings','debts'].every(k=>Array.isArray(v[k])))return v}catch{}return fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const month=()=>new Date().toISOString().slice(0,7);const uid=()=>crypto.randomUUID();const total=(a,k='amount')=>a.reduce((s,x)=>s+Number(x[k]||0),0);const inMonth=t=>String(t.date||'').slice(0,7)===month();function go(p){if(!pages.includes(p))return;page=p;formOpen='';document.getElementById('allMenu').classList.add('hide');render();if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);window.scrollTo(0,0)}function toggleMenu(){document.getElementById('allMenu').classList.toggle('hide')}function quickLinks(){return pages.filter(p=>p!=='Dashboard').map(p=>{const i=pages.indexOf(p);return `<button class="quicklink" onclick="go('${p}')"><span>${icons[i]}</span>${p}</button>`}).join('')}function nav(){const n=pages.map((p,i)=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')">${icons[i]} &nbsp;${p}</button>`).join('');document.getElementById('desktopNav').innerHTML=n;document.querySelectorAll('#mobileNav .mobileTab').forEach(b=>{const target=b.dataset.page;b.classList.toggle('active',target===page||(target==='More'&&['Debts','Settings'].includes(page)))});document.getElementById('pageTitle').textContent=page}function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function empty(s){return `<div class="empty">${s}</div>`}function item(title,sub,right,action=''){return `<div class="item row"><div><b>${esc(title)}</b><div class="muted small">${esc(sub)}</div></div><div style="text-align:right"><b>${right}</b>${action}</div></div>`}function buttonDelete(type,id){return `<div><button class="btn secondary small danger" onclick="removeItem('${type}','${id}')">Delete</button></div>`}function removeItem(type,id){if(!confirm('Delete this entry?'))return;data[type]=data[type].filter(x=>x.id!==id);save()}function bar(v,max){return `<div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,max?100*v/max:0))}%"></div></div>`}function dashboard(){const ts=data.transactions.filter(inMonth),inc=total(ts.filter(x=>x.type==='income')),out=total(ts.filter(x=>x.type==='expense'));const bills=total(data.bills),budget=total(data.budgets,'limit'),net=inc-out;const cats={};ts.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);return `<section><h2>Explore your finances</h2><div class="quicklinks">${quickLinks()}</div></section><div class="cards">${[['Income',inc],['Spent',out],['Remaining',net],['Monthly bills',bills]].map(([n,v])=>`<div class="card"><div class="muted">${n}</div><strong class="${n==='Remaining'?(v>=0?'positive':'negative'):''}">${money(v)}</strong></div>`).join('')}</div><div class="grid">${panel('Spending by category',sorted.length?sorted.map(([c,v])=>`<div class="row"><span>${esc(c)}</span><b>${money(v)}</b></div>${bar(v,out)}`).join(''):empty('Add an expense to see your spending breakdown.'))}${panel('Monthly budget',`<div class="row"><span>Spent</span><b>${money(out)} / ${money(budget)}</b></div>${bar(out,budget)}<p class="muted small">${budget?`${money(budget-out)} left against your category limits.`:'Create category budgets to track your spending.'}</p><button class="btn secondary" onclick="go('Budgets')">Manage budgets</button>`)}</div>${panel('Recent transactions',ts.length?ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(t=>item(t.title,`${t.date} · ${t.category}`,`<span class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span>`)).join(''):empty('No transactions this month yet.'))}`}
function field(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function select(label,name,opts){return `<label>${label}<select name="${name}">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`}function form(type,fields){return `<form class="panel form" onsubmit="submitEntry(event,'${type}')">${fields}<div class="full actions"><button class="btn" type="submit">Save entry</button><button class="btn secondary" type="button" onclick="render()">Cancel</button></div></form>`}let formOpen='';function openForm(type){page=({transactions:'Transactions',bills:'Bills',budgets:'Budgets',savings:'Savings',debts:'Debts'})[type];formOpen=type;render()}function openTransaction(){openForm('transactions')}function submitEntry(e,type){e.preventDefault();const f=new FormData(e.target),o={id:uid()};for(const [k,v] of f.entries())o[k]=v.trim();for(const k of ['amount','limit','target','saved','balance','payment'])if(k in o)o[k]=Number(o[k]);if(Object.entries(o).some(([k,v])=>['amount','limit','target','saved','balance','payment'].includes(k)&&(!Number.isFinite(v)||v<0))){alert('Please enter valid non-negative amounts.');return}data[type].push(o);formOpen='';save()}
const categories=['Housing','Groceries','Transport','Eating out','Shopping','Entertainment','Health','Subscriptions','Salary','Other'];function transactions(){const ts=data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));return `${formOpen==='transactions'?form('transactions',select('Type','type',['expense','income'])+field('Description','title')+field('Amount (£)','amount','number','min="0.01" step="0.01"')+select('Category','category',categories)+field('Date','date','date',`value="${new Date().toLocaleDateString('en-CA')}"`)):''}${panel('Transaction history',`<button class="btn" onclick="openForm('transactions')">+ New transaction</button>${ts.length?ts.map(t=>item(t.title,`${t.date} · ${t.category} · ${t.type}`,money(t.amount),buttonDelete('transactions',t.id))).join(''):empty('No transactions yet.')}`)}`}
function bills(){return `${formOpen==='bills'?form('bills',field('Bill name','title')+field('Monthly amount (£)','amount','number','min="0" step="0.01"')+field('Payment day (1–31)','day','number','min="1" max="31"')):''}${panel('Recurring bills & subscriptions',`<button class="btn" onclick="openForm('bills')">+ Add bill</button><p class="muted small">Expected monthly commitments: ${money(total(data.bills))}. Bills are reminders only and do not automatically create transactions.</p>${data.bills.length?data.bills.map(b=>item(b.title,`Due on day ${b.day} of each month`,money(b.amount),buttonDelete('bills',b.id))).join(''):empty('No bills added yet.')}`)}`}
function budgets(){const ts=data.transactions.filter(inMonth).filter(t=>t.type==='expense');return `${formOpen==='budgets'?form('budgets',select('Category','category',categories)+field('Monthly limit (£)','limit','number','min="0" step="0.01"')):''}${panel('Category spending limits',`<button class="btn" onclick="openForm('budgets')">+ Set budget</button>${data.budgets.length?data.budgets.map(b=>{const spent=total(ts.filter(t=>t.category===b.category));return `<div class="item"><div class="row"><b>${esc(b.category)}</b><span>${money(spent)} / ${money(b.limit)}</span></div>${bar(spent,b.limit)}<div class="row"><span class="small ${spent>b.limit?'negative':'muted'}">${spent>b.limit?'Over budget':'Within budget'}</span>${buttonDelete('budgets',b.id)}</div></div>`}).join(''):empty('Add a category spending limit.')}`)}`}
function savings(){return `${formOpen==='savings'?form('savings',field('Goal name','title')+field('Target (£)','target','number','min="0.01" step="0.01"')+field('Already saved (£)','saved','number','min="0" step="0.01"')):''}${panel('Savings goals',`<button class="btn" onclick="openForm('savings')">+ New savings goal</button>${data.savings.length?data.savings.map(s=>`<div class="item"><div class="row"><b>${esc(s.title)}</b><span>${money(s.saved)} / ${money(s.target)}</span></div>${bar(s.saved,s.target)}<div class="row"><button class="btn secondary small" onclick="adjust('savings','${s.id}','saved',1)">Add savings</button>${buttonDelete('savings',s.id)}</div></div>`).join(''):empty('No savings goals yet.')}`)}`}
function debts(){const rows=data.debts.length?data.debts.map(d=>item(d.title,'Planned repayment: '+money(d.payment)+'/month',money(d.balance),'<div class="actions"><button class="btn secondary small" onclick="adjust(\'debts\',\''+d.id+'\',\'balance\',-1)">Record repayment</button>'+buttonDelete('debts',d.id)+'</div>')).join(''):empty('No debts added yet.');const fields=field('Debt name','title')+field('Outstanding balance (£)','balance','number','min="0" step="0.01"')+field('Planned monthly repayment (£)','payment','number','min="0" step="0.01"');return (formOpen==='debts'?form('debts',fields):'')+panel('Debt repayment','<button class="btn" onclick="openForm(\'debts\')">+ Add debt</button>'+rows)}
function adjust(type,id,key,sign){const x=data[type].find(x=>x.id===id);if(!x)return;const raw=prompt(sign===1?'Amount to add (£):':'Repayment amount (£):');if(raw===null)return;const n=Number(raw);if(!Number.isFinite(n)||n<=0){alert('Enter a positive amount.');return}x[key]=Math.max(0,Math.round((Number(x[key])+sign*n)*100)/100);save()}
function settings(){return `${panel('Backup & restore',`<p class="muted">Export your data as a JSON file. Store it securely, as it contains your financial information.</p><div class="actions"><button class="btn" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Restore backup</button></div>`)}${panel('Privacy & storage',`<p class="muted">All data is stored in this browser using localStorage. There are no analytics, bank connections or cloud accounts. Browser data may be lost if you clear site storage or switch devices.</p><button class="btn danger" onclick="resetData()">Erase all local data</button>`)}`}
function exportData(){const blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='budgetflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Backup file is too large');const v=JSON.parse(await f.text());if(!['transactions','bills','budgets','savings','debts'].every(k=>Array.isArray(v[k])))throw Error('Invalid backup format');if(!confirm('Replace all existing data with this backup?'))return;data=Object.fromEntries(['transactions','bills','budgets','savings','debts'].map(k=>[k,v[k].filter(x=>x&&typeof x==='object').map(x=>({...x,id:uid()}))]));save()}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}});function resetData(){if(confirm('Permanently erase all BudgetFlow data from this browser?')){data=fresh();save()}}function render(){nav();document.getElementById('menuLinks').innerHTML=quickLinks();document.getElementById('content').innerHTML=({Dashboard:dashboard,Transactions:transactions,Bills:bills,Budgets:budgets,Savings:savings,Debts:debts,Settings:settings})[page]();document.getElementById('appStatus').textContent='Ready · '+page}window.addEventListener('hashchange',()=>{const p=decodeURIComponent(location.hash.slice(1));if(p==='More'){toggleMenu()}else if(pages.includes(p)){go(p)}});const initial=decodeURIComponent(location.hash.slice(1));if(pages.includes(initial))page=initial;try{render()}catch(err){document.getElementById('appStatus').textContent='App error: '+err.message;console.error(err)}
