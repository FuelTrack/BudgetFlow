<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160d2b"><title>BudgetFlow 4.0</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#153441;background:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:#f3f7f8}button,input,select{font:inherit}button{cursor:pointer}header{background:#102f3c;color:white;padding:25px 20px 40px}header h1{margin:0;font-size:29px;letter-spacing:-1px}header p{color:#b9d5d8;margin:5px 0}.accent{color:#78e2bc}main{max-width:1000px;margin:-20px auto 0;padding:0 16px 120px}.hero{background:white;border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 8px 30px #102f3c19;color:#153441}.hero strong{font-size:34px;display:block;margin:8px 0}.hero small{color:#67808b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:white;border:1px solid #e0e9eb;border-radius:17px;padding:17px;margin-bottom:14px}.metric strong{display:block;font-size:23px;margin-top:8px}.muted{color:#627b85}.positive{color:#008b70}.negative{color:#c33f52}.button{border:0;background:#087e70;color:white;padding:11px 15px;border-radius:11px;font-weight:700}.button.secondary{background:#e3f3ee;color:#08695e}.button.danger{background:#ffe8e8;color:#a02d39}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionTitle h2{font-size:21px;margin:8px 0 15px}.entry{padding:13px 0;border-bottom:1px solid #e6eef0;display:flex;justify-content:space-between;gap:10px;align-items:center}.entry:last-child{border:0}.entry small{display:block;color:#627b85;margin-top:5px}.entry strong{font-size:15px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#355463;font-size:14px}.form input,.form select{width:100%;background:white;color:#153441;border:1px solid #b9cfd1;border-radius:10px;padding:12px;min-width:0}.progress{background:#e1eeeb;height:10px;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#1ca88f}.hint{font-size:13px;color:#627b85}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-top:1px solid #d7e6e8;padding:8px 5px calc(9px + env(safe-area-inset-bottom,0px));z-index:100;box-shadow:0 -8px 25px #102f3c16}.bottom a{text-decoration:none;color:#617a84;text-align:center;font-size:11px;border-radius:12px;padding:8px 2px;min-width:0}.bottom a span{display:block;font-size:22px;margin-bottom:3px}.bottom a.active{background:#e0f5ee;color:#087e70;font-weight:700}.hidden{display:none!important}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#087e70;color:white;border-radius:12px;padding:12px 16px;z-index:200;max-width:90%}.desktop{display:none}@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{max-width:700px;left:50%;transform:translateX(-50%);border:1px solid #d7e6e8;border-radius:20px 20px 0 0}.form{grid-template-columns:repeat(2,1fr)}.form .wide{grid-column:1/-1}}.v4chart{display:flex;gap:12px;align-items:end;height:180px;padding:15px 0 0}.v4bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.v4bar>div{background:linear-gradient(#17ad92,#087e70);width:75%;min-height:3px;border-radius:7px 7px 0 0}.v4bar small{color:#637b85}.v4category{display:flex;justify-content:space-between;margin-top:14px}.v4filters{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.v4filters input,.v4filters select{padding:10px;border:1px solid #b9cfd1;border-radius:10px;min-width:0;background:white;color:#153441}.v4calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.v4calendar>b{text-align:center;padding:8px 0}.v4day{border:1px solid #e0e9eb;border-radius:8px;min-height:66px;padding:5px;overflow-wrap:anywhere}.v4day small{display:block;color:#087e70;font-size:9px;margin-top:4px}@media(max-width:480px){.v4day{min-height:55px;padding:3px}.v4calendar{gap:2px}} </style></head><body><header><h1>budget<span class="accent">flow.</span> <small style="font-size:12px;color:#80ddbf">FRESH 3.0</small></h1><p id="subtitle">Your money, made clearer.</p></header><main id="app"><div class="panel">Loading BudgetFlow…</div></main>
<nav class="bottom" aria-label="Primary navigation"><a href="#dashboard" data-route="dashboard"><span>⌂</span>Home</a><a href="#transactions" data-route="transactions"><span>⇄</span>Activity</a><a href="#bills" data-route="bills"><span>▣</span>Bills</a><a href="#budgets" data-route="budgets"><span>◉</span>Budgets</a><a href="#more" data-route="more"><span>☰</span>More</a></nav>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
const KEY='budgetflow-v1',types=['transactions','bills','budgets','savings','debts'];
const empty=()=>({transactions:[],bills:[],budgets:[],savings:[],debts:[]});
let data=empty(),route='dashboard',editing='';
try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&types.every(k=>Array.isArray(stored[k])))data=stored}catch(e){console.warn('Could not read saved data',e)}
const app=document.getElementById('app'),money=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(v)||0);
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const sum=(a,k='amount')=>a.reduce((n,x)=>n+(Number(x[k])||0),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const month=()=>today().slice(0,7);
const uuid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const categories=['Housing','Groceries','Transport','Eating out','Shopping','Entertainment','Health','Subscriptions','Salary','Other'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Unable to save in this browser')}render()}
function notify(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function heading(title,action){return '<div class="sectionTitle"><h2>'+title+'</h2>'+(action||'')+'</div>'}
function btn(text,action,style=''){return '<button class="button '+style+'" type="button" data-action="'+action+'">'+text+'</button>'}
function entry(title,subtitle,amount,kind,id){return '<div class="entry"><div><strong>'+safe(title)+'</strong><small>'+safe(subtitle)+'</small></div><div style="text-align:right"><strong>'+money(amount)+'</strong><div>'+btn('Delete','delete:'+kind+':'+id,'secondary')+'</div></div></div>'}
function progress(a,b){return '<div class="progress"><span style="width:'+Math.min(100,Math.max(0,b>0?a/b*100:0))+'%"></span></div>'}
function dashboard(){const tx=data.transactions.filter(x=>String(x.date).slice(0,7)===month()),inc=sum(tx.filter(x=>x.type==='income')),spent=sum(tx.filter(x=>x.type==='expense'));const metrics=[['Income',inc],['Spent',spent],['Bills',sum(data.bills)],['Available',inc-spent]];return '<div class="hero"><small>THIS MONTH · '+month()+'</small><strong>'+money(inc-spent)+'</strong><small>Income minus recorded expenses</small></div><div class="grid">'+metrics.map(x=>'<div class="panel metric"><span class="muted">'+x[0]+'</span><strong>'+money(x[1])+'</strong></div>').join('')+'</div><div class="panel">'+heading('Quick actions')+'<div class="actions">'+btn('+ Transaction','new:transactions')+btn('+ Bill','new:bills','secondary')+btn('+ Budget','new:budgets','secondary')+'</div></div><div class="panel">'+heading('Recent activity')+(tx.length?tx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5).map(x=>entry(x.title,x.category+' · '+x.date,(x.type==='income'?1:-1)*x.amount,'transactions',x.id)).join(''):'<p class="muted">Add your first transaction to start tracking.</p>')+'</div>'}
function listPage(kind,title){const names={transactions:'Transaction',bills:'Bill',budgets:'Budget',savings:'Savings goal',debts:'Debt'};let content='<div class="panel">'+heading(title,btn('+ Add '+names[kind],'new:'+kind))+(data[kind].length?data[kind].map(x=>{if(kind==='transactions')return entry(x.title,x.type+' · '+x.category+' · '+x.date,(x.type==='income'?1:-1)*x.amount,kind,x.id);if(kind==='bills')return entry(x.title,'Due day '+x.day+' each month',x.amount,kind,x.id);if(kind==='budgets'){const used=sum(data.transactions.filter(t=>t.type==='expense'&&t.category===x.category&&String(t.date).slice(0,7)===month()));return '<div class="entry"><div style="flex:1"><strong>'+safe(x.category)+'</strong><small>'+money(used)+' of '+money(x.limit)+' used</small>'+progress(used,x.limit)+'</div>'+btn('Delete','delete:budgets:'+x.id,'secondary')+'</div>'}if(kind==='savings')return '<div class="entry"><div style="flex:1"><strong>'+safe(x.title)+'</strong><small>'+money(x.saved)+' / '+money(x.target)+'</small>'+progress(x.saved,x.target)+btn('Add savings','adjust:savings:'+x.id,'secondary')+'</div>'+btn('Delete','delete:savings:'+x.id,'secondary')+'</div>';return '<div class="entry"><div><strong>'+safe(x.title)+'</strong><small>Monthly plan: '+money(x.payment)+'</small><strong>'+money(x.balance)+' remaining</strong></div><div>'+btn('Repay','adjust:debts:'+x.id,'secondary')+' '+btn('Delete','delete:debts:'+x.id,'danger')+'</div></div>'}).join(''):'<p class="muted">Nothing added yet. Tap Add to get started.</p>')+'</div>';return content}
function more(){return '<div class="panel">'+heading('More tools')+'<div class="actions">'+btn('Savings goals','route:savings')+btn('Debt tracker','route:debts')+btn('Settings & backup','route:settings','secondary')+'</div><p class="hint">All features are free. Your financial information stays in this browser.</p></div>'}
function settings(){return '<div class="panel">'+heading('Backup & privacy')+'<p class="muted">Data is stored only in this browser. It is not encrypted, does not sync across devices, and can be lost if browser storage is cleared. Export a backup regularly.</p><div class="actions">'+btn('Download backup','export')+btn('Restore backup','import','secondary')+btn('Erase local data','reset','danger')+'</div></div>'}
function input(label,name,type='text',attributes=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+attributes+' required></label>'}
function select(label,name,options){return '<label>'+label+'<select name="'+name+'">'+options.map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join('')+'</select></label>'}
function form(kind){let fields='';if(kind==='transactions')fields=select('Type','type',['expense','income'])+input('Description','title')+input('Amount (£)','amount','number','min="0.01" step="0.01"')+select('Category','category',categories)+input('Date','date','date','value="'+today()+'"');if(kind==='bills')fields=input('Bill name','title')+input('Monthly amount (£)','amount','number','min="0.01" step="0.01"')+input('Due day (1–31)','day','number','min="1" max="31"');if(kind==='budgets')fields=select('Category','category',categories)+input('Monthly limit (£)','limit','number','min="0.01" step="0.01"');if(kind==='savings')fields=input('Goal name','title')+input('Target (£)','target','number','min="0.01" step="0.01"')+input('Already saved (£)','saved','number','min="0" step="0.01"');if(kind==='debts')fields=input('Debt name','title')+input('Balance (£)','balance','number','min="0.01" step="0.01"')+input('Planned monthly repayment (£)','payment','number','min="0" step="0.01"');return '<div class="panel">'+heading('Add '+kind.replace('transactions','transaction'))+'<form id="entryForm" class="form" data-kind="'+kind+'">'+fields+'<div class="wide actions"><button type="submit" class="button">Save entry</button>'+btn('Cancel','cancel','secondary')+'</div></form></div>'}
function render(){const titles={dashboard:'Dashboard',transactions:'Transactions',bills:'Bills',budgets:'Budgets',savings:'Savings',debts:'Debts',settings:'Settings',more:'More'};document.getElementById('subtitle').textContent=titles[route]+' · Personal finance';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('active',a.dataset.route===(['savings','debts','settings'].includes(route)?'more':route)));app.innerHTML=(editing?form(editing):route==='dashboard'?dashboard():route==='more'?more():route==='settings'?settings():listPage(route,titles[route]));}
function navigate(next){const allowed=['dashboard','transactions','bills','budgets','more','savings','debts','settings','calendar'];if(!allowed.includes(next))next='dashboard';route=next;editing='';render();window.scrollTo(0,0)}
function handleAction(action){const [verb,kind,id]=action.split(':');if(verb==='route'){location.hash=kind;navigate(kind)}else if(verb==='new'){route=kind;editing=kind;render();window.scrollTo(0,0)}else if(verb==='cancel'){editing='';render()}else if(verb==='delete'){if(confirm('Delete this entry?')){data[kind]=data[kind].filter(x=>String(x.id)!==id);persist()}}else if(verb==='adjust'){const item=data[kind].find(x=>String(x.id)===id);if(!item)return;const raw=prompt(kind==='savings'?'How much to add (£)?':'Repayment amount (£)?');if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0){notify('Enter a valid amount');return}if(kind==='savings')item.saved=Math.round((Number(item.saved)+amount)*100)/100;else item.balance=Math.max(0,Math.round((Number(item.balance)-amount)*100)/100);persist()}else if(verb==='export'){const blob=new Blob([JSON.stringify({version:2,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='budgetflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}else if(verb==='import'){document.getElementById('backupFile').click()}else if(verb==='reset'){if(confirm('Erase all local BudgetFlow records?')){data=empty();persist()}}}
document.addEventListener('click',e=>{const link=e.target.closest('a[data-route]');if(link){e.preventDefault();location.hash=link.dataset.route;navigate(link.dataset.route);return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action)});
document.addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();const kind=e.target.dataset.kind,record={id:uuid()};new FormData(e.target).forEach((v,k)=>record[k]=v);for(const key of ['amount','limit','target','saved','balance','payment'])if(key in record){record[key]=Number(record[key]);if(!Number.isFinite(record[key])||record[key]<0){notify('Enter valid amounts');return}}if(kind==='budgets')data.budgets=data.budgets.filter(x=>x.category!==record.category);data[kind].push(record);editing='';persist();notify('Saved successfully')});
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('File too large');const parsed=JSON.parse(await file.text());if(!types.every(k=>Array.isArray(parsed[k])))throw Error('Invalid backup');if(confirm('Replace all existing data with this backup?')){data=Object.fromEntries(types.map(k=>[k,parsed[k]]));persist();notify('Backup restored')}}catch(err){notify('Restore failed: '+err.message)}finally{e.target.value=''}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));

/* BudgetFlow 4.0 enhancements: all original storage keys and routes preserved */
const v4key='budgetflow-v4-extras';
let extras={recurring:[],categories:[],lastBackup:null};
try{const e=JSON.parse(localStorage.getItem(v4key)||'null');if(e&&typeof e==='object')extras={...extras,...e}}catch(e){}
function saveExtras(){try{localStorage.setItem(v4key,JSON.stringify(extras))}catch(e){notify('Could not save extra settings')}}
function recurringDue(r){const start=String(r.start||today());const until=String(r.until||'9999-12-31');const dates=[];const limit=new Date(today()+'T12:00:00');const current=new Date(start+'T12:00:00');if(!Number.isFinite(current.getTime()))return dates;let count=0;while(current<=limit&&count++<600){const date=current.getFullYear()+'-'+String(current.getMonth()+1).padStart(2,'0')+'-'+String(current.getDate()).padStart(2,'0');if(date>until)break;dates.push(date);if(r.frequency==='weekly')current.setDate(current.getDate()+7);else if(r.frequency==='yearly')current.setFullYear(current.getFullYear()+1);else{const day=Number(start.slice(8,10));current.setDate(1);current.setMonth(current.getMonth()+1);const end=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();current.setDate(Math.min(day,end))}}return dates}
function syncRecurring(){let changed=false;for(const r of extras.recurring){for(const date of recurringDue(r)){if(!data.transactions.some(t=>t.recurringId===r.id&&t.date===date)){data.transactions.push({id:uuid(),title:r.title,amount:Number(r.amount),type:r.type,category:r.category,date,recurringId:r.id});changed=true}}}if(changed){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Could not save recurring entries')}}}
function barChart(rows){const max=Math.max(1,...rows.map(x=>x[1]));return '<div class="v4chart">'+rows.map(([label,value])=>'<div class="v4bar"><div style="height:'+Math.max(3,100*value/max)+'%"></div><small>'+safe(label)+'</small></div>').join('')+'</div>'}
function v4Dashboard(){const months=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});const rows=months.map(m=>[m.slice(5),sum(data.transactions.filter(t=>t.type==='expense'&&String(t.date).startsWith(m)))]);const thisMonth=data.transactions.filter(t=>String(t.date).startsWith(month()));const expenses=thisMonth.filter(t=>t.type==='expense');const groups=Object.entries(expenses.reduce((a,t)=>(a[t.category]=(a[t.category]||0)+Number(t.amount||0),a),{})).sort((a,b)=>b[1]-a[1]);return dashboard()+'<div class="panel">'+heading('Spending over 6 months')+barChart(rows)+'</div><div class="panel">'+heading('Where your money goes')+(groups.length?groups.map(([c,n])=>'<div class="v4category"><span>'+safe(c)+'</span><strong>'+money(n)+'</strong></div>'+progress(n,sum(expenses))).join(''):'<p class="muted">Record expenses to see your breakdown.</p>')+'</div>'}
function v4Transactions(){const q=String(v4Filter||'').toLowerCase(),matches=data.transactions.filter(t=>(String(t.title)+' '+String(t.category)).toLowerCase().includes(q)&&(!v4Type||t.type===v4Type)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return '<div class="panel">'+heading('Transactions',btn('+ Add','new:transactions'))+'<div class="v4filters"><input id="v4Search" placeholder="Search transactions" value="'+safe(v4Filter)+'" aria-label="Search transactions"><select id="v4Type" aria-label="Filter type"><option value="">All types</option><option value="expense" '+(v4Type==='expense'?'selected':'')+'>Expenses</option><option value="income" '+(v4Type==='income'?'selected':'')+'>Income</option></select></div>'+(matches.length?matches.map(t=>'<div class="entry"><div><strong>'+safe(t.title)+'</strong><small>'+safe(t.category)+' · '+safe(t.date)+(t.recurringId?' · Recurring':'')+'</small></div><div style="text-align:right"><strong>'+money(t.amount)+'</strong><div>'+btn('Edit','edit:transactions:'+t.id,'secondary')+' '+btn('Delete','delete:transactions:'+t.id,'danger')+'</div></div></div>').join(''):'<p class="muted">No matching transactions.</p>')+'</div><div class="panel">'+heading('Recurring transactions',btn('+ Schedule','newrecurring'))+(extras.recurring.length?extras.recurring.map(r=>'<div class="entry"><div><strong>'+safe(r.title)+'</strong><small>'+safe(r.frequency)+' · '+safe(r.start)+'</small></div><div>'+money(r.amount)+' '+btn('Remove','removerecurring:'+r.id,'secondary')+'</div></div>').join(''):'<p class="muted">Schedule income or spending to be added when you open the app.</p>')+'</div>'}
let v4Filter='',v4Type='',v4EditId=null;
function v4Calendar(){const first=new Date(v4CalendarMonth+'-01T12:00:00'),year=first.getFullYear(),m=first.getMonth(),days=new Date(year,m+1,0).getDate(),offset=(first.getDay()+6)%7;const events={};for(const b of data.bills){const day=Math.min(days,Math.max(1,Number(b.day)||1));(events[day]??=[]).push(safe(b.title)+' '+money(b.amount))}for(const t of data.transactions.filter(x=>String(x.date).startsWith(v4CalendarMonth))){const day=Number(String(t.date).slice(8,10));(events[day]??=[]).push(safe(t.title)+' '+money(t.amount))}return '<div class="panel">'+heading('Financial calendar')+'<div class="actions">'+btn('‹ Previous','calprev','secondary')+'<strong style="align-self:center">'+safe(v4CalendarMonth)+'</strong>'+btn('Next ›','calnext','secondary')+'</div><div class="v4calendar">'+['M','T','W','T','F','S','S'].map(d=>'<b>'+d+'</b>').join('')+Array.from({length:offset},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>'<div class="v4day"><b>'+(i+1)+'</b>'+(events[i+1]||[]).map(x=>'<small>'+x+'</small>').join('')+'</div>').join('')+'</div><p class="hint">Shows recorded transactions and monthly bill due dates; it does not send notifications.</p></div>'}
let v4CalendarMonth=month();
function v4Budgets(){const days=new Date(Number(month().slice(0,4)),Number(month().slice(5)),0).getDate(),remainingDays=Math.max(1,days-Number(today().slice(8))+1);return listPage('budgets','Budgets')+'<div class="panel">'+heading('Daily allowance')+(data.budgets.length?data.budgets.map(b=>{const used=sum(data.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&String(t.date).startsWith(month())));const left=Number(b.limit)-used;return '<div class="entry"><div><strong>'+safe(b.category)+'</strong><small>'+money(Math.max(0,left)/remainingDays)+' per remaining day</small></div><strong class="'+(left<0?'negative':'positive')+'">'+(left<0?'Over by ':'Left ')+money(Math.abs(left))+'</strong></div>'}).join(''):'<p class="muted">Create a budget to see daily allowances.</p>')+'</div>'}
function v4Savings(){return listPage('savings','Savings')+'<div class="panel">'+heading('Savings projections')+(data.savings.length?data.savings.map(g=>{const target=Number(g.target)||0,left=Math.max(0,target-(Number(g.saved)||0)),monthly=left/12;return '<div class="entry"><div><strong>'+safe(g.title)+'</strong><small>To reach your goal in 12 months</small></div><strong>'+money(monthly)+'/month</strong></div>'}).join(''):'<p class="muted">Add a savings goal to see a contribution plan.</p>')+'</div>'}
function v4RecurringForm(){return '<div class="panel">'+heading('Schedule recurring transaction')+'<form id="v4RecurringForm" class="form">'+select('Type','type',['expense','income'])+input('Description','title')+input('Amount (£)','amount','number','min="0.01" step="0.01"')+select('Category','category',categories)+select('Repeat','frequency',['monthly','weekly','yearly'])+input('Start date','start','date','value="'+today()+'"')+'<div class="wide actions"><button class="button" type="submit">Save schedule</button>'+btn('Cancel','cancel','secondary')+'</div></form></div>'}
function v4EditForm(){const t=data.transactions.find(x=>x.id===v4EditId);if(!t)return v4Transactions();return '<div class="panel">'+heading('Edit transaction')+'<form id="v4EditForm" class="form">'+select('Type','type',['expense','income']).replace('value="'+t.type+'"','value="'+t.type+'" selected')+input('Description','title','text','value="'+safe(t.title)+'"')+input('Amount (£)','amount','number','min="0.01" step="0.01" value="'+safe(t.amount)+'"')+select('Category','category',categories).replace('value="'+safe(t.category)+'"','value="'+safe(t.category)+'" selected')+input('Date','date','date','value="'+safe(t.date)+'"')+'<div class="wide actions"><button class="button" type="submit">Save changes</button>'+btn('cancel','cancel','secondary')+'</div></form></div>'}
function v4Settings(){return settings()+'<div class="panel">'+heading('Data protection')+'<p class="muted">Your data remains in local browser storage, not encrypted or synchronised. Export backups before clearing browser data. Recurring schedules are included in BudgetFlow 4.0 backups.</p>'+btn('Download CSV','csv')+' '+btn('Download complete JSON','export4')+'</div>'}
function v4More(){return more()+'<div class="panel">'+heading('Planning')+'<div class="actions">'+btn('Financial calendar','route:calendar')+btn('Recurring payments','route:transactions')+'</div></div>'}
const originalRender=render;
render=function(){if(route==='calendar'){document.getElementById('subtitle').textContent='Calendar · Personal finance';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('active',a.dataset.route==='more'));app.innerHTML=v4Calendar();return}if(editing==='recurring'){app.innerHTML=v4RecurringForm();return}if(editing==='edittransaction'){app.innerHTML=v4EditForm();return}originalRender();if(editing)return;if(route==='dashboard')app.innerHTML=v4Dashboard();if(route==='transactions')app.innerHTML=v4Transactions();if(route==='budgets')app.innerHTML=v4Budgets();if(route==='savings')app.innerHTML=v4Savings();if(route==='settings')app.innerHTML=v4Settings();if(route==='more')app.innerHTML=v4More()};
const originalNavigate=navigate;
navigate=function(next){if(next==='calendar'){route='calendar';editing='';render();window.scrollTo(0,0)}else originalNavigate(next)};
const originalHandleAction=handleAction;
handleAction=function(action){const [verb,kind,id]=action.split(':');if(verb==='newrecurring'){editing='recurring';render();return}if(verb==='removerecurring'){if(confirm('Remove this recurring schedule? Existing transactions will remain.')){extras.recurring=extras.recurring.filter(x=>x.id!==kind);saveExtras();render()}return}if(verb==='edit'){v4EditId=id;editing='edittransaction';render();return}if(verb==='calprev'||verb==='calnext'){const d=new Date(v4CalendarMonth+'-01T12:00:00');d.setMonth(d.getMonth()+(verb==='calprev'?-1:1));v4CalendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();return}if(verb==='csv'){const lines=[['Date','Type','Description','Category','Amount'],...data.transactions.map(t=>[t.date,t.type,t.title,t.category,t.amount])];const csv=lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');v4Download(csv,'budgetflow-transactions.csv','text/csv');return}if(verb==='export4'){v4Download(JSON.stringify({version:4,...data,extras},null,2),'budgetflow-complete-'+today()+'.json','application/json');return}originalHandleAction(action)};
function v4Download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.addEventListener('input',e=>{if(e.target.id==='v4Search'){v4Filter=e.target.value;const start=e.target.selectionStart;render();const box=document.getElementById('v4Search');box.focus();box.setSelectionRange(start,start)}});
document.addEventListener('change',e=>{if(e.target.id==='v4Type'){v4Type=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='v4RecurringForm'){e.preventDefault();e.stopImmediatePropagation();const r={id:uuid()};new FormData(e.target).forEach((v,k)=>r[k]=v);r.amount=Number(r.amount);if(!(r.amount>0))return notify('Enter a valid amount');extras.recurring.push(r);saveExtras();syncRecurring();editing='';render();notify('Recurring schedule saved')}else if(e.target.id==='v4EditForm'){e.preventDefault();e.stopImmediatePropagation();const t=data.transactions.find(x=>x.id===v4EditId);if(!t)return;new FormData(e.target).forEach((v,k)=>t[k]=v);t.amount=Number(t.amount);if(!(t.amount>0))return notify('Enter a valid amount');editing='';persist();notify('Transaction updated')}},true);
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.version===4&&parsed.extras&&confirm('Restore recurring schedules from this backup?')){extras={...extras,...parsed.extras};saveExtras()}}catch(err){}},true);
syncRecurring();

navigate(location.hash.slice(1)||'dashboard');
})();
</script></body></html>
